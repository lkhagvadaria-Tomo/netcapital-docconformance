# Supabase CLI project config. Not used inside the sandbox this repo was
# scaffolded in (no docker daemon available there — see README "Known
# environment limitations"). Run `supabase start` on a machine with Docker
# to get a full local stack (Postgres + Auth + Storage) for development.

project_id = "netcapital-docconformance"

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_CLIENT_SECRET)"

[api]
enabled = true
port = 54321

[studio]
enabled = true
port = 54323
